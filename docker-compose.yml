services:
  trading-db:
    image: postgres:16-alpine 
    container_name: trading_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: TradingDb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TradingDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-exchanges:
    build:
      context: .
      target: mock
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  aggregator:
    build:
      context: .
      target: aggregator
    depends_on:
      trading-db:
        condition: service_healthy
      mock-exchanges:
        condition: service_started
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=trading-db;Port=5432;Database=TradingDb;Username=postgres;Password=postgres;Timeout=3;CommandTimeout=5
      - BinanceUrl=ws://mock-exchanges:8080/binance
      - CoinbaseUrl=ws://mock-exchanges:8080/coinbase
      - ASPNETCORE_URLS=http://+:8080

volumes:
  pg_data:
    